# SecureNotes CI — Week 17, Part B
# Run the complete test suite on every push and pull request targeting main.

name: CI

# >>> TASK 6: triggers for pushes and pull requests to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# <<< END TASK 6

# >>> TASK 7: one Ubuntu test job with checkout, Python, install, and pytest
jobs:
  test:
    name: Test SecureNotes
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run the full test suite
        run: pytest -q
# <<< END TASK 7
